<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scalp Scan</title>
<meta name="description" content="Scan hair-care ingredient lists for Malassezia triggers">
<meta name="theme-color" content="#2f6f5e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<style>
  :root { --bg:#fafaf7; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e3e2dc; --accent:#2f6f5e;
          --red:#c0392b; --amber:#b9770e; --blue:#2e6da4; --green:#2e8b57; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#151514; --fg:#ecebe6; --muted:#9a9993; --card:#1f1f1d; --line:#33332f; --accent:#5fb39b;
            --red:#ff6b5b; --amber:#f0b041; --blue:#6aa8e8; --green:#5cc98a; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.45 system-ui, sans-serif }
  main { max-width:640px; margin:auto; padding:12px 16px 48px }
  h1 { font-size:1.25rem; margin:4px 0 12px }
  video, canvas { width:100%; border-radius:10px; background:#000; display:none }
  .row { display:flex; gap:8px; margin:10px 0; flex-wrap:wrap }
  button, label.btn { flex:1; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff;
          font:inherit; font-weight:600; text-align:center; cursor:pointer }
  button.alt, label.btn { background:var(--card); color:var(--fg); border:1px solid var(--line) }
  textarea { width:100%; min-height:90px; padding:10px; border-radius:10px; border:1px solid var(--line);
          background:var(--card); color:var(--fg); font:14px/1.4 ui-monospace, monospace }
  #status { color:var(--muted); font-size:.9rem; min-height:1.3em }
  #verdict { font-size:1.15rem; font-weight:700; margin:14px 0 6px }
  .hit { background:var(--card); border:1px solid var(--line); border-left:6px solid; border-radius:8px;
          padding:8px 10px; margin:6px 0 }
  .hit b { text-transform:capitalize } .hit small { color:var(--muted); display:block }
  .red { border-left-color:var(--red) } .amber { border-left-color:var(--amber) }
  .blue { border-left-color:var(--blue) } .green { border-left-color:var(--green) }
  footer { color:var(--muted); font-size:.8rem; margin-top:24px }
  a { color:var(--accent) }
</style>
</head>
<body>
<main>
  <h1>Scalp Scan <small style="font-weight:400;color:var(--muted)">— Malassezia ingredient checker</small></h1>
  <video id="video" playsinline muted></video>
  <canvas id="canvas"></canvas>
  <div class="row">
    <button id="camera">Start camera</button>
    <button id="snap" hidden>Scan label</button>
    <label class="btn">Photo…<input id="file" type="file" accept="image/*" capture="environment" hidden></label>
  </div>
  <div id="status"></div>
  <textarea id="text" placeholder="Ingredient list appears here after scanning — or paste / type it (e.g. from Google Lens “Copy text”). Fix any misread words, then tap Check."></textarea>
  <div class="row"><button id="check" class="alt">Check ingredients</button></div>
  <div id="verdict"></div>
  <div id="results"></div>
  <footer>
    <span style="color:var(--red)">■</span> feeds Malassezia ·
    <span style="color:var(--amber)">■</span> debated ·
    <span style="color:var(--blue)">■</span> helpful antifungal ·
    <span style="color:var(--green)">■</span> generally safe.
    Not medical advice. <a href="RESEARCH.md">Research &amp; sources</a>.
  </footer>
</main>
<script src="vendor/tesseract.min.js"></script>
<script src="match.js"></script>
<script src="app.js"></script>
</body>
</html>
